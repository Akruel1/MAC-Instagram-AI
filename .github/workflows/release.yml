# Release builds for Instagram AI Studio.
# Trigger: version tags (v*) or manual workflow_dispatch.
# Does not notarize unless secrets are configured.
# Pin third-party actions to immutable SHAs.
#
# Runner note (2026-11): macOS 14 GitHub-hosted images are retired.
# Use macos-15 (arm64). Target binary architectures are produced via
# swift build --arch {arm64|x86_64} and verified with lipo — runner arch
# need not match target arch.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional VERSION override (defaults to Scripts/version.env)"
        required: false
        type: string
      create_draft_release:
        description: "Create/update a draft GitHub Release after builds"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Existing tag to attach the draft release to (e.g. v0.3.0). Leave empty when triggered by a tag push."
        required: false
        type: string
        default: "v0.3.0"

# Minimal token permissions. contents:write is required to create draft releases
# and upload assets. Do not broaden beyond this workflow's needs.
permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Prefer the newest installed Xcode; fall back to default path.
          if [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Swift tests
        run: swift test

      - name: TestHarness
        run: swift run -c debug TestHarness

  build-matrix:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both targets built on supported macos-15 (arm64) runners.
          # x86_64 is cross-compiled; lipo verifies the Mach-O arch.
          - arch: arm64
            runner: macos-15
            platform_slug: AppleSilicon-arm64
          - arch: x86_64
            runner: macos-15
            platform_slug: Intel-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version
          uname -m

      - name: Load version
        id: ver
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source Scripts/version.env
          OVERRIDE="${{ github.event.inputs.version_override || '' }}"
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using VERSION=$VERSION BUILD_NUMBER=$BUILD_NUMBER"

      - name: Generate icon
        run: |
          chmod +x Scripts/*.sh
          Scripts/generate_app_icon.sh

      - name: Package app (${{ matrix.arch }})
        run: |
          chmod +x Scripts/*.sh
          # Unsigned in CI unless Developer ID secrets are configured.
          Scripts/package_macos_app.sh release "${{ matrix.arch }}" none

      - name: Verify architecture
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source Scripts/version.env
          OVERRIDE="${{ github.event.inputs.version_override || '' }}"
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          fi
          APP="build/apps/InstagramAIStudio-${VERSION}-macOS-${{ matrix.arch }}.app"
          BIN="$APP/Contents/MacOS/InstagramAIStudio"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs=$ARCHS"
          echo "$ARCHS" | grep -q "${{ matrix.arch }}"
          test -f "$APP/Contents/Resources/AppIcon.icns"

      - name: Package DMG
        run: |
          chmod +x Scripts/*.sh
          Scripts/package_dmg.sh "${{ matrix.arch }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dmg-${{ matrix.platform_slug }}
          path: |
            build/release/*.dmg
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release (draft)
    needs: build-matrix
    runs-on: ubuntu-latest
    # Tag pushes always create a draft. workflow_dispatch creates a draft only when requested,
    # attaching assets to an existing tag (recovery path for v0.3.0 without moving the tag).
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_draft_release == true)
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source Scripts/version.env
          OVERRIDE="${{ github.event.inputs.version_override || '' }}"
          if [[ -n "$OVERRIDE" ]]; then
            VERSION="$OVERRIDE"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            if [[ -z "$TAG" ]]; then
              echo "error: release_tag is required for workflow_dispatch draft release" >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Draft release target tag=$TAG version=$VERSION"

      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: release-assets

      - name: Collect release files
        id: collect
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist
          find release-assets -type f \( -name '*.dmg' -o -name '*.sha256' \) -exec cp {} dist/ \;
          cd dist
          test -f "InstagramAIStudio-${VERSION}-macOS-Intel-x86_64.dmg"
          test -f "InstagramAIStudio-${VERSION}-macOS-AppleSilicon-arm64.dmg"
          shasum -a 256 *.dmg | tee SHA256SUMS.txt
          ls -la
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Instagram AI Studio ${{ steps.collect.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Instagram AI Studio ${{ steps.collect.outputs.version }}

            Native macOS app for local creative workflows.

            ### Downloads
            - **Intel (x86_64):** `InstagramAIStudio-${{ steps.collect.outputs.version }}-macOS-Intel-x86_64.dmg`
            - **Apple Silicon (arm64):** `InstagramAIStudio-${{ steps.collect.outputs.version }}-macOS-AppleSilicon-arm64.dmg`

            ### Compatibility
            - macOS 14+
            - Separate architecture builds (not a universal binary)

            ### Signing / Gatekeeper
            Builds are **not** Apple Developer ID signed and are **not notarized by Apple** unless release secrets were configured.

            **Method A — Control-click:** Drag the app to Applications, then Control-click → Open (confirm when prompted).

            **Method B — Privacy & Security:** Open the app; if blocked, go to System Settings → Privacy & Security → Open Anyway → confirm.

            Do not disable Gatekeeper, use `spctl --master-disable`, or remove quarantine attributes.

            ### Known limitations
            - Studio video editor is marked Coming soon
            - Live Instagram / Claude integrations require your own credentials and are not pre-verified
            - FFmpeg is detected from MacPorts or Homebrew when installed (not bundled)
            - CI builds on macOS 15 arm64 runners; Intel binaries are cross-compiled and arch-verified with `lipo` (Intel CI runtime not claimed)

            See `SHA256SUMS.txt` for checksums.
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
